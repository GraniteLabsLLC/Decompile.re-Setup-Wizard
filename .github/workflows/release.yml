name: Build release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-latest
            rid: win-arm64
          - runner: macos-latest
            rid: osx-x64
          - runner: macos-latest
            rid: osx-arm64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-latest
            rid: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.301
      - name: Restore locked dependencies
        run: dotnet restore DecompileRe.SetupWizard.sln --locked-mode
      - name: Publish self-contained application
        shell: pwsh
        run: |
          dotnet publish src/DecompileRe.SetupWizard `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/${{ matrix.rid }}
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath Decompile.re-Setup-${{ matrix.rid }}.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Decompile.re-Setup-${{ matrix.rid }}
          path: Decompile.re-Setup-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Create unsigned draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "$GITHUB_REF_NAME build candidate"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
