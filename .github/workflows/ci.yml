name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.301
      - name: Restore locked dependencies
        run: dotnet restore DecompileRe.SetupWizard.sln --locked-mode
      - name: Build
        run: dotnet build DecompileRe.SetupWizard.sln -c Release --no-restore
      - name: Test
        run: dotnet test DecompileRe.SetupWizard.sln -c Release --no-build --no-restore
